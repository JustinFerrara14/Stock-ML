name: MLOps

on:
  # Runs on pushes targeting main branch
  push:
    branches:
      - main

  # Runs on pull requests
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Allow the creation and usage of self-hosted runners
permissions:
  contents: read
  id-token: write

jobs:
  train-and-report:
    permissions: write-all
    runs-on: self-hosted
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install --requirement requirements-freeze.txt
      - name: Login to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}'
      - name: Train model
        run: dvc repro --pull
      - name: Push the outcomes to DVC remote storage
        run: dvc push
      - name: Commit changes in dvc.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Commit changes in dvc.lock
          file_pattern: dvc.lock
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup CML
        uses: iterative/setup-cml@v2
        with:
          version: '0.20.6'
      - name: Create CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all other Git branches
          git fetch --depth=1 origin main:main

          # Add title to the report
          echo "# Experiment Report (${{ github.sha }})" >> report.md

          # Compare parameters to main branch
          echo "## Params workflow vs. main" >> report.md
          dvc params diff main --md >> report.md

          # Compare metrics to main branch
          echo "## Metrics workflow vs. main" >> report.md
          dvc metrics diff main --md >> report.md

          # Compare plots (images) to main branch
          dvc plots diff main

          # Create plots
          echo "## Plots" >> report.md

          # Create training history plot
          echo "### Training History" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_loss_curve "Training History (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_loss_curve_30_11_2025 "Training History (Dataset 2)")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_loss_curve.png "Training History (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_loss_curve_30_11_2025.png "Training History (Dataset 2)")' >> report.md

          # Create best 1 predictions preview
          echo "### Best Prediction 1 Preview" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_best_prediction_1.png "Best Prediction 1 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_best_prediction_1_30_11_2025.png "Best Prediction 1 Preview (Dataset 2)")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_best_prediction_1.png "Best Prediction 1 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_best_prediction_1_30_11_2025.png "Best Prediction 1 Preview (Dataset 2)")' >> report.md

          # Create best 2 predictions preview
          echo "### Best Prediction 2 Preview" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_best_prediction_2.png "Best Prediction 2 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_best_prediction_2_30_11_2025.png "Best Prediction 2 Preview (Dataset 2)")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_best_prediction_2.png "Best Prediction 2 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_best_prediction_2_30_11_2025.png "Best Prediction 2 Preview (Dataset 2)")' >> report.md

          # Create worst 1 predictions preview
          echo "### Worst Prediction 1 Preview" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_worst_prediction_1.png "Worst Prediction 1 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_worst_prediction_1_30_11_2025.png "Worst Prediction 1 Preview (Dataset 2)")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_worst_prediction_1.png "Worst Prediction 1 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_worst_prediction_1_30_11_2025.png "Worst Prediction 1 Preview (Dataset 2)")' >> report.md

          # Create worst 2 predictions preview
          echo "### Worst Prediction 2 Preview" >> report.md
          echo "#### main" >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_worst_prediction_2.png "Worst Predictions 2 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/main_evaluation_plots_worst_prediction_2_30_11_2025.png "Worst Predictions 2 Preview (Dataset 2)")' >> report.md
          echo "#### workspace" >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_worst_prediction_2.png "Worst Prediction 2 Preview (Dataset 1)")' >> report.md
          echo '![](./dvc_plots/static/workspace_evaluation_plots_worst_prediction_2_30_11_2025.png "Worst Prediction 2 Preview (Dataset 2)")' >> report.md

          # Model-level comparison between the two datasets on this branch
          echo "## Model comparison (Dataset 1 vs Dataset 2)" >> report.md

          METRICS_1="evaluation/metrics.json"
          METRICS_2="evaluation/metrics_30_11_2025.json"

          if [ -f "$METRICS_1" ] && [ -f "$METRICS_2" ]; then
            MAE1=$(python -c "import json;print(json.load(open('$METRICS_1'))['mae'])")
            RMSE1=$(python -c "import json;print(json.load(open('$METRICS_1'))['rmse'])")
            R21=$(python -c "import json;print(json.load(open('$METRICS_1'))['r2'])")

            MAE2=$(python -c "import json;print(json.load(open('$METRICS_2'))['mae'])")
            RMSE2=$(python -c "import json;print(json.load(open('$METRICS_2'))['rmse'])")
            R22=$(python -c "import json;print(json.load(open('$METRICS_2'))['r2'])")

            echo "" >> report.md
            echo "| Model (dataset)                  | MAE | RMSE | R² |" >> report.md
            echo "|----------------------------------|-----|------|----|" >> report.md
            echo "| Dataset 1 (data/prepared)        | $MAE1 | $RMSE1 | $R21 |" >> report.md
            echo "| Dataset 2 (data/prepared_30_11_2025) | $MAE2 | $RMSE2 | $R22 |" >> report.md

            echo "" >> report.md
            echo "Lower MAE/RMSE and higher R² indicate a better model." >> report.md
          else
            echo "" >> report.md
            echo "_Model comparison skipped: metrics files not found (expected $METRICS_1 and $METRICS_2)._" >> report.md
          fi

          # Publish the CML report
          cml comment update --target=pr --publish report.md
  publish-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install --requirement requirements-freeze.txt
      - name: Login to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}'
      - name: Check model
        run: dvc repro --pull
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_CONTAINER_REGISTRY_HOST }}
          username: _json_key
          password: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      - name: Import the BentoML model
        run: bentoml models import model/stock-ml.bentomodel
      - name: Build the BentoML model artifact
        run: bentoml build src
      - name: Containerize and publish the BentoML model artifact Docker image
        run: |
          # Containerize the Bento
          bentoml containerize stock-ml:latest \
            --image-tag ${{ secrets.GCP_CONTAINER_REGISTRY_HOST }}/stock-ml:latest \
            --image-tag ${{ secrets.GCP_CONTAINER_REGISTRY_HOST }}/stock-ml:${{ github.sha }}
          # Push the container to the Container Registry
          docker push --all-tags ${{ secrets.GCP_CONTAINER_REGISTRY_HOST }}/stock-ml
      - name: Get Google Cloud's Kubernetes credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_K8S_CLUSTER_NAME }}
          location: ${{ secrets.GCP_K8S_CLUSTER_ZONE }}
      - name: Update the Kubernetes deployment
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ secrets.GCP_CONTAINER_REGISTRY_HOST }}/stock-ml:${{ github.sha }}"' kubernetes/deployment.yaml
      - name: Deploy the model on Kubernetes
        run: |
          kubectl apply \
            -f kubernetes/deployment.yaml \
            -f kubernetes/service.yaml