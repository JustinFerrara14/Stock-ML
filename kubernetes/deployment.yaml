apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ml-deployment
  labels:
    app: stock-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-ml
  template:
    metadata:
      labels:
        app: stock-ml
    spec:
      containers:
      - name: stock-ml
        image: europe-west1-docker.pkg.dev/stock-ml-476313/mlops-stock-registry/stock-ml:latest