stages:
  prepare:
    cmd: python3.12 src/prepare.py data/raw data/prepared
    deps:
    - data/raw
    - src/prepare.py
    - src/utils/seed.py
    params:
    - prepare
    outs:
    - data/prepared
  prepare_30_11_2025:
    cmd: python3.12 src/prepare.py data/raw_30_11_2025 data/prepared_30_11_2025
    deps:
    - data/raw_30_11_2025
    - src/prepare.py
    - src/utils/seed.py
    params:
    - prepare
    outs:
    - data/prepared_30_11_2025
  train:
    cmd: python3.12 src/train.py data/prepared model
    deps:
    - data/prepared
    - src/train.py
    - src/utils/seed.py
    params:
    - train
    outs:
    - model
    plots:
    - evaluation/plots/loss_curve.png
  train_30_11_2025:
    cmd: python3.12 src/train.py data/prepared_30_11_2025 model_30_11_2025
    deps:
    - data/prepared_30_11_2025
    - src/train.py
    - src/utils/seed.py
    params:
    - train
    outs:
    - model_30_11_2025
    plots:
    - evaluation/plots/loss_curve_30_11_2025.png
  evaluate:
    cmd: python3.12 src/evaluate.py model data/prepared ""
    deps:
    - model
    - src/evaluate.py
    metrics:
    - evaluation/metrics.json
    plots:
    - evaluation/plots/forecast_example.png
    - evaluation/plots/best_prediction_1.png
    - evaluation/plots/best_prediction_2.png
    - evaluation/plots/worst_prediction_1.png
    - evaluation/plots/worst_prediction_2.png
  evaluate_30_11_2025:
    cmd: python3.12 src/evaluate.py model_30_11_2025 data/prepared_30_11_2025 _30_11_2025
    deps:
    - model_30_11_2025
    - src/evaluate.py
    metrics:
    - evaluation/metrics_30_11_2025.json
    plots:
    - evaluation/plots/forecast_example_30_11_2025.png
    - evaluation/plots/best_prediction_1_30_11_2025.png
    - evaluation/plots/best_prediction_2_30_11_2025.png
    - evaluation/plots/worst_prediction_1_30_11_2025.png
    - evaluation/plots/worst_prediction_2_30_11_2025.png
